[project]
name = "esphome-boot-hid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["esphome==2026.10.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ziglang==0.15.2",
    "ruff==0.17.2",
    "clang-format==23.1.3",
    "playwright>=1.64.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

