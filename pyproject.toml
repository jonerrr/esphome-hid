[project]
name = "esphome-boot-hid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["esphome==2026.10.2"]

[dependency-groups]
dev = [
  "clang-format==23.1.3",
  "playwright>=1.64.1",
  "pytest>=9.2.0",
  "ruff==0.17.4",
  "ziglang==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
